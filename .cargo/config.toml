[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
linker = "ld"
rustflags = [
  "-C", "relocation-model=static",
  "-C", "code-model=kernel",
  "-C", "panic=abort",
  "-C", "target-feature=-mmx,-sse,-sse2,-redzone",
  "-C", "link-arg=-nostdlib",
  "-C", "link-arg=-n",
  "-C", "link-arg=-Tlinker/kernel.ld",
]
