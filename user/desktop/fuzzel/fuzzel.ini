# PeetOS desktop session: the fuzzel application launcher (docs/desktop.md).
# It lists the entries in /usr/share/applications; type to filter, Enter to
# start, Escape to close.

[main]
font=DejaVu Sans:size=11
icon-theme=AdwaitaLegacy
terminal=foot
prompt="Run: "
lines=8
width=36
layer=overlay

[colors]
background=f6f5f4ff
text=2e3436ff
prompt=2e3436ff
input=2e3436ff
match=1c71d8ff
selection=3584e4ff
selection-text=ffffffff
selection-match=ffffffff
border=1c71d8ff

[border]
width=2
radius=6
